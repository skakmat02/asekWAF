# AsekWAF test fixture — subset of CRS protocol enforcement rules (for local UI smoke tests).
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|POST|OPTIONS)$" \
    "id:911100,phase:1,deny,status:403,log,msg:'Method is not allowed by policy',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-generic',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule REQUEST_HEADERS:Content-Length "!@rx ^\d+$" \
    "id:920100,phase:1,deny,status:400,log,msg:'Invalid HTTP Request Line',severity:'WARNING',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-protocol',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule REQUEST_HEADERS:Host "@rx (?:\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b|^\[?[0-9a-fA-F:]+\]?$)" \
    "id:920350,phase:1,block,status:403,log,msg:'Host header is a numeric IP address',severity:'WARNING',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-protocol',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule REQUEST_URI|ARGS "@rx (?:\.\./|\.\.\\\\)" \
    "id:930100,phase:2,block,status:403,log,msg:'Path Traversal Attack (/../)',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-lfi',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule REQUEST_FILENAME|ARGS "@rx (?:/etc/passwd|/etc/shadow|/proc/self/)" \
    "id:930110,phase:2,block,status:403,log,msg:'Remote File Inclusion Attack',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-lfi',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)<script[^>]*>" \
    "id:941100,phase:2,block,status:403,log,msg:'XSS Attack Detected via libinjection',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-xss',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)(?:onerror|onload|javascript:)" \
    "id:941110,phase:2,block,status:403,log,msg:'XSS Filter - Category 1: Script Tag Vector',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-xss',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS|REQUEST_BODY "@rx (?i)(?:document\.cookie|alert\s*\()" \
    "id:941160,phase:2,block,status:403,log,msg:'NoScript XSS InjectionChecker: HTML Injection',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-xss',tag:'paranoia-level/2',ver:'OWASP_CRS/4.31.0-dev'"
