# AsekWAF test fixture — subset of CRS SQL injection rules (for local UI smoke tests).
SecRule ARGS|REQUEST_BODY "@detectSQLi" \
    "id:942100,phase:2,block,status:403,log,msg:'SQL Injection Attack Detected via libinjection',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)\b(?:select|union|insert|update|delete|drop)\b.{0,40}\b(?:from|into|table|where)\b" \
    "id:942110,phase:2,block,status:403,log,msg:'SQL Injection Attack: Common Injection Testing Detected',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)(?:'|\x22)\s*(?:or|and)\s+(?:'|\x22)?\d+(?:'|\x22)?\s*=\s*(?:'|\x22)?\d+" \
    "id:942120,phase:2,block,status:403,log,msg:'SQL Injection Attack: SQL Operator Detected',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)(?:sleep\s*\(|benchmark\s*\(|pg_sleep\s*\()" \
    "id:942130,phase:2,block,status:403,log,msg:'SQL Injection Attack: SQL Tautology Detected',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)(?:information_schema|sysobjects|pg_catalog|sqlite_master)" \
    "id:942200,phase:2,block,status:403,log,msg:'SQL Injection Attack: MySQL and MSSQL Comment Injection',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/2',ver:'OWASP_CRS/4.31.0-dev'"

SecRule ARGS|REQUEST_BODY "@rx (?i)(?:--|#)\s*$" \
    "id:942260,phase:2,block,status:403,log,msg:'SQL Injection Attack: SQL Comment Sequence Detected',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',tag:'paranoia-level/2',ver:'OWASP_CRS/4.31.0-dev'"
