# AsekWAF test fixture — subset of CRS anomaly scoring rules (for local UI smoke tests).
SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:949110,phase:2,deny,status:403,log,msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.ANOMALY_SCORE})',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-generic',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule TX:OUTBOUND_ANOMALY_SCORE "@ge %{tx.outbound_anomaly_score_threshold}" \
    "id:959100,phase:4,deny,status:403,log,msg:'Outbound Anomaly Score Exceeded (Total Score: %{TX.OUTBOUND_ANOMALY_SCORE})',severity:'CRITICAL',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-generic',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"

SecRule TX:EXECUTING_PARANOIA_LEVEL "@lt 1" \
    "id:980130,phase:2,pass,log,msg:'Anomaly Scores',severity:'INFO',tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-generic',tag:'paranoia-level/1',ver:'OWASP_CRS/4.31.0-dev'"
