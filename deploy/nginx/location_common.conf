# AsekWAF internal health endpoint.
# It is intentionally restricted to loopback and bypasses ModSecurity so
# container health checks never create audit events or depend on CRS state.
location = /healthz {
    if ($remote_addr !~ "^(127\\.0\\.0\\.1|::1)$") {
        return 404;
    }
    allow 127.0.0.1;
    allow ::1;
    deny all;
    modsecurity off;
    access_log off;
    log_not_found off;
    default_type text/plain;
    return 200 "OK\n";
}

location = /metrics/nginx {
    access_log off;
    allow 127.0.0.0/24;
    allow ::1;
    deny all;
    proxy_store off;
    stub_status;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
}
